<!doctype html>
<html lang="en" class="home-laminate-document">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCB stack-up: moisture and heat</title>
  <link rel="stylesheet" href="../static/typography.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--pcb-body-font); color: #243e38; }
    .viewer {
      --stress-color: #7f8165;
      min-height: 544px; padding: 22px 24px 18px;
      border: 1px solid #dce7e2; border-radius: 20px;
      background: radial-gradient(ellipse at 50% 48%, #fff 0%, #f3f8f5 75%);
    }
    h2 { margin: 0 0 6px; font-size: 18px; font-weight: 650; }
    .intro, .note { margin: 0; color: #60756d; font-size: 13px; line-height: 1.5; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    button {
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      border: 1px solid #cbdcd3; background: #fff; color: #315e50;
      border-radius: 999px; padding: 8px 18px; transition: background .2s;
    }
    button:hover { background: #e7f1eb; }
    button:focus-visible { outline: 3px solid #368575; outline-offset: 3px; }
    button[aria-pressed="true"] { background: #368575; border-color: #368575; color: #fff; }
    #reset { margin-left: auto; background: transparent; font-weight: 400; }
    .scene { display: block; width: 100%; height: 300px; margin: 6px 0; }
    .scene text { font-family: inherit; text-anchor: middle; dominant-baseline: middle; }
    .diagram-heading { font-size: 11px; letter-spacing: 1.6px; fill: #60756d; font-weight: 650; }
    .mask rect { fill: #368575; }
    .mask text { fill: #fff; font-size: 11px; font-weight: 600; }
    .copper rect { fill: #df9b65; }
    .copper text { fill: #57351f; font-size: 13px; font-weight: 600; }
    .laminate .material { fill: #dce8cd; }
    .laminate text { fill: #37522d; font-size: 16px; font-weight: 650; }
    .layer rect { stroke: rgb(37 66 48 / 18%); stroke-width: 1; }
    .layer text, .original-outline { pointer-events: none; }
    .original-outline { fill: none; stroke: #778b80; stroke-width: 1.3; stroke-dasharray: 5 5; opacity: .65; }
    .viewer[data-mode="moisture"] { --stress-color: #368575; }
    .viewer[data-mode="heat"] { --stress-color: #b57349; }
    .restraint-arrow { fill: none; stroke: currentColor; stroke-width: 3; marker-end: url(#restraint-arrowhead); }
    #restraint-arrows { color: var(--stress-color); pointer-events: none; }
    .bond-caption { fill: #60756d; font-size: 10px; letter-spacing: .7px; }
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 18px; font-size: 12px; margin: 0 0 16px; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; background: #df9b65; }
    .mask-swatch { background: #368575; }
    .laminate-swatch { background: #dce8cd; border: 1px solid #a5ba97; }
    .outline-swatch { background: transparent; border: 1px dashed #778b80; }
    .arrow-swatch { color: #7f8165; font-size: 20px; line-height: 12px; }
    #status { min-height: 64px; font-size: 14px; line-height: 1.5; margin: 0 0 10px; }
    .note { font-size: 11px; }
    @media (max-width: 420px) {
      .viewer { padding: 18px 14px; }
      .scene { height: 260px; }
      button { padding: 8px 14px; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <section class="viewer" data-mode="rest" aria-label="Interactive PCB stack-up illustration">
    <h2>A look inside a PCB</h2>
    <p class="intro">Choose Moisture, Heat or both. Click an active option to remove it.</p>
    <div class="controls" role="group" aria-label="Exposure controls">
      <button type="button" data-exposure="moisture" aria-pressed="false">Moisture</button>
      <button type="button" data-exposure="heat" aria-pressed="false">Heat</button>
      <button type="button" id="reset" aria-label="Reset layers to their original size">Reset</button>
    </div>
    <svg class="scene" viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-labelledby="stack-title stack-description">
      <title id="stack-title">Bonded PCB layers and restrained expansion</title>
      <desc id="stack-description">Bonded stack: copper and laminate share the same in-plane deformation at each interface.</desc>
      <defs>
        <marker id="restraint-arrowhead" viewBox="0 0 8 8" refX="8" refY="4"
                markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path id="arrow-tip" d="M0 0L8 4L0 8Z" fill="#7f8165" />
        </marker>
      </defs>
      <text class="diagram-heading" x="260" y="25">BONDED STACK · TWO COPPER LAYERS</text>
      <g id="mask-top" class="layer mask">
        <rect x="85" y="73" width="350" height="18" />
        <text x="260" y="82">Solder mask</text>
      </g>
      <g id="copper-top" class="layer copper">
        <rect x="85" y="91" width="350" height="26" />
        <text x="260" y="104">Copper · L1</text>
      </g>
      <g id="laminate" class="layer laminate">
        <rect class="material" x="85" y="117" width="350" height="96" />
        <text x="260" y="165">FR-4 / laminate core</text>
      </g>
      <g id="copper-bottom" class="layer copper">
        <rect x="85" y="213" width="350" height="26" />
        <text x="260" y="226">Copper · L2</text>
      </g>
      <g id="mask-bottom" class="layer mask">
        <rect x="85" y="239" width="350" height="18" />
        <text x="260" y="248">Solder mask</text>
      </g>
      <rect class="original-outline" x="85" y="73" width="350" height="184" />
      <g id="restraint-arrows" opacity="0" aria-hidden="true">
        <path class="restraint-arrow" data-side="left" data-row="primary" />
        <path class="restraint-arrow" data-side="right" data-row="primary" />
        <path class="restraint-arrow" data-side="left" data-row="bottom" />
        <path class="restraint-arrow" data-side="right" data-row="bottom" />
      </g>
      <text id="restraint-caption" class="bond-caption" x="260" y="300">BONDED LAYERS · SHARED EXPANSION</text>
    </svg>
    <div class="legend" aria-hidden="true">
      <span><i class="swatch mask-swatch"></i>Solder mask</span>
      <span><i class="swatch"></i>Copper</span>
      <span><i class="swatch laminate-swatch"></i>Laminate</span>
      <span><i class="swatch outline-swatch"></i>Original size</span>
      <span><span class="arrow-swatch">→</span>Expansion restraint</span>
    </div>
    <p id="status" role="status" aria-live="polite">Bonded stack: copper and laminate share the same in-plane deformation at each interface.</p>
  </section>
  <script>
    const viewer = document.querySelector('.viewer');
    const description = document.querySelector('#stack-description');
    const status = document.querySelector('#status');
    const buttons = document.querySelectorAll('[data-exposure]');
    const exposures = new Set();
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const layers = ['mask-top', 'copper-top', 'laminate', 'copper-bottom', 'mask-bottom'].map(id => {
      const group = document.getElementById(id);
      return {rectangles: group.querySelectorAll('rect'), label: group.querySelector('text')};
    });
    const restraint = document.querySelector('#restraint-arrows');
    const arrows = restraint.querySelectorAll('path');
    const restraintCaption = document.querySelector('#restraint-caption');
    const arrowTip = document.querySelector('#arrow-tip');
    const descriptions = {
      rest: 'Bonded stack: copper and laminate share the same in-plane deformation at each interface.',
      moisture: 'Moisture: the laminate swells, while the bonded copper layers limit its expansion. The inward arrows show this restraint on the laminate.',
      heat: 'Heat: copper tends to expand more than the laminate in this example. The inward arrows at both copper layers show their expansion being restrained by the laminate.',
      combined: 'Heat + moisture: moisture swelling partly offsets the thermal mismatch in this example. The laminate still tends to expand more overall, so the arrows show its restraint by the copper.'
    };

    function reserveStatusSpace() {
      // Measure every description at the current width without changing the live region.
      const probe = document.createElement('p');
      probe.setAttribute('aria-hidden', 'true');
      Object.assign(probe.style, {
        position: 'absolute', visibility: 'hidden', pointerEvents: 'none', margin: '0',
        width: `${status.getBoundingClientRect().width}px`, font: getComputedStyle(status).font
      });
      viewer.appendChild(probe);
      let height = 0;
      Object.values(descriptions).forEach(text => {
        probe.textContent = text;
        height = Math.max(height, probe.getBoundingClientRect().height);
      });
      probe.remove();
      status.style.height = `${Math.ceil(height)}px`;
      status.style.flexShrink = '0';
    }
    reserveStatusSpace();
    new ResizeObserver(reserveStatusSpace).observe(status);
    document.fonts.ready.then(reserveStatusSpace);

    function dimensions() {
      const moisture = exposures.has('moisture') ? 1 : 0;
      const heat = exposures.has('heat') ? 1 : 0;
      // Shared illustrative strain enforces in-plane compatibility. This is
      // a visual interpolation, not a stiffness-weighted mechanics solution.
      const coreFreeStrain = .18 * moisture + .10 * heat;
      const copperFreeStrain = .17 * heat;
      const sharedWidth = 350 * (1 + (coreFreeStrain + copperFreeStrain) / 2);
      const mismatch = coreFreeStrain - copperFreeStrain;
      const coreHeight = 96 * (1 + .25 * moisture + .10 * heat);
      const copperHeight = 26 * (1 + .17 * heat);
      const heights = [18, copperHeight, coreHeight, copperHeight, 18];
      let y = 165 - heights.reduce((sum, height) => sum + height, 0) / 2;
      return heights.map((height, i) => {
        const row = {x: 260 - sharedWidth / 2, y, width: sharedWidth, height, mismatch};
        y += height;
        return row;
      });
    }

    function render(rows) {
      rows.forEach((row, i) => {
        layers[i].rectangles.forEach(rect => {
          for (const key of ['x', 'y', 'width', 'height']) rect.setAttribute(key, row[key]);
        });
        layers[i].label.setAttribute('y', row.y + row.height / 2);
      });
      const core = rows[2];
      // Show one pair on the laminate or one pair on each copper layer,
      // depending on which material wants more expansion. These are not external loads.
      restraint.setAttribute('opacity', Math.min(1, Math.abs(core.mismatch) / .015));
      const color = {moisture: '#368575', heat: '#b57349'}[viewer.dataset.mode] || '#7f8165';
      arrowTip.setAttribute('fill', color);
      const copperRestrained = core.mismatch < 0;
      arrows.forEach(arrow => {
        const bottom = arrow.dataset.row === 'bottom';
        arrow.setAttribute('visibility', bottom && !copperRestrained ? 'hidden' : 'visible');
        const restrainedLayer = copperRestrained ? rows[bottom ? 3 : 1] : core;
        const arrowY = restrainedLayer.y + restrainedLayer.height / 2;
        const left = arrow.dataset.side === 'left';
        const edge = left ? core.x : core.x + core.width;
        const direction = left ? 1 : -1;
        arrow.setAttribute('d', `M${edge - direction * 36} ${arrowY}H${edge - direction * 8}`);
      });
      restraintCaption.textContent = Math.abs(core.mismatch) < .001
        ? 'BONDED LAYERS · SHARED EXPANSION'
        : core.mismatch > 0 ? 'COPPER RESTRAINS LAMINATE EXPANSION' : 'LAMINATE RESTRAINS COPPER EXPANSION';
    }

    let current = dimensions();
    let animationFrame = null;
    render(current);
    function animate(target) {
      if (animationFrame !== null) cancelAnimationFrame(animationFrame);
      if (reducedMotion.matches) {
        current = target;
        render(current);
        animationFrame = null;
        return;
      }
      const start = current.map(row => ({...row}));
      const startedAt = performance.now();
      function step(now) {
        const progress = Math.min(1, (now - startedAt) / 1100);
        const eased = 1 - Math.pow(1 - progress, 3);
        current = start.map((row, i) => Object.fromEntries(
          Object.keys(row).map(key => [key, row[key] + (target[i][key] - row[key]) * eased])
        ));
        render(current);
        animationFrame = progress < 1 ? requestAnimationFrame(step) : null;
      }
      animationFrame = requestAnimationFrame(step);
    }

    function selectExposure(exposure) {
      if (exposure === 'rest') exposures.clear();
      else if (exposures.has(exposure)) exposures.delete(exposure);
      else exposures.add(exposure);
      const mode = exposures.size === 2 ? 'combined' : exposures.values().next().value || 'rest';
      viewer.dataset.mode = mode;
      buttons.forEach(button => {
        button.setAttribute('aria-pressed', String(exposures.has(button.dataset.exposure)));
      });
      status.textContent = descriptions[mode];
      description.textContent = descriptions[mode];
      animate(dimensions());
    }
    buttons.forEach(button => button.addEventListener('click', () => selectExposure(button.dataset.exposure)));
    document.querySelector('#reset').addEventListener('click', () => selectExposure('rest'));
    reducedMotion.addEventListener('change', () => animate(dimensions()));
  </script>
</body>
</html>
